{% comment %}
Esqueleto de carregamento de uma lista (padrão P18). Parâmetro: linhas (padrão 5).
Uso: <div id="resultados" hx-get="{{ request.get_full_path }}" hx-trigger="load">
       {% include "componentes/esqueleto_linhas.html" with linhas=8 %}
     </div>
{% endcomment %}
<div class="cartao" aria-hidden="true">
  <div class="osso h-3 w-1/4"></div>
  {% with quantas=linhas|default:5 %}
    {% for _ in ""|ljust:quantas %}
      <div class="mt-5 flex items-center gap-4">
        <div class="osso h-3.5 {% cycle 'w-2/5' 'w-1/2' 'w-1/3' %}"></div>
        <div class="osso ml-auto h-3.5 w-1/6"></div>
      </div>
    {% endfor %}
  {% endwith %}
</div>
<span class="sr-only">Carregando…</span>
