name: Publicar
on: { workflow_dispatch: {} }
concurrency: { group: publicar, cancel-in-progress: false }
permissions: { contents: read }
jobs:
  testes:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/ci.yml
  backup:
    if: github.ref == 'refs/heads/main'
    needs: testes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Conferir a URL de produção antes de mexer em qualquer coisa
        env:
          URL_PRODUCAO: ${{ vars.URL_PRODUCAO }}
        run: |
          if [ -z "$URL_PRODUCAO" ]; then
            echo "A variável URL_PRODUCAO do repositório está vazia (ex.: https://helptoner-pedidos.vercel.app, sem barra no fim)." >&2
            exit 1
          fi
      - uses: actions/checkout@v5
      - uses: ./.github/actions/backup
        with:
          nome: backup-antes-de-publicar-${{ github.run_id }}
          database-url: ${{ secrets.DATABASE_URL_DIRETA }}
          senha: ${{ secrets.BACKUP_SENHA }}
  migrar:
    if: github.ref == 'refs/heads/main'
    needs: backup
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DJANGO_SETTINGS_MODULE: config.settings.producao
      DJANGO_ALLOWED_HOSTS: localhost
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with: { enable-cache: true }
      - run: uv python install 3.14
      - run: uv sync --locked --no-dev
      - name: Migrar o banco de produção
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_DIRETA }}
          DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
        run: uv run --no-dev python manage.py migrate --noinput
  publicar:
    if: github.ref == 'refs/heads/main'
    needs: migrar
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Publicar na Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          set -euo pipefail
          URL_DEPLOY="$(npx --yes vercel@latest deploy --prod --yes --token "$VERCEL_TOKEN")"
          echo "Publicado em: $URL_DEPLOY"
      - name: Conferir o sistema no ar
        env:
          URL_PRODUCAO: ${{ vars.URL_PRODUCAO }}
        run: |
          set -euo pipefail
          if [ -z "$URL_PRODUCAO" ]; then
            echo "A variável URL_PRODUCAO do repositório está vazia (ex.: https://helptoner-pedidos.vercel.app, sem barra no fim)." >&2
            exit 1
          fi
          resposta="$(curl -fsS --connect-timeout 10 --max-time 30 --retry 5 --retry-delay 5 --retry-all-errors "${URL_PRODUCAO%/}/saude/")"
          echo "Resposta de /saude/: $resposta"
          if ! printf '%s' "$resposta" | grep -Eq '"status": *"ok"'; then
            echo "O /saude/ não devolveu o JSON esperado (status ok). Confira se URL_PRODUCAO usa https:// e aponta para o sistema." >&2
            exit 1
          fi
